[project]
name = "flowprog"
version = "1.0.0"
description = "Define material flows models as programs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Rick Lupton", email = "mail@ricklupton.name"},
]
keywords = ["material flow analysis", "mfa", "lca", "sympy"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "sympy>=1.11.1",
    "pandas>=2.2.0",
    "rdflib>=6.0",
]

[project.urls]
Homepage = "https://github.com/probs-lab/flowprog"
Repository = "https://github.com/probs-lab/flowprog"
Issues = "https://github.com/probs-lab/flowprog/issues"
Changelog = "https://github.com/probs-lab/flowprog/blob/main/CHANGELOG.md"

[project.optional-dependencies]
numpyro = [
    "jax>=0.4",
    "jaxlib>=0.4",
    "numpyro>=0.12",
]
benchmarks = [
    "doit>=0.37.0",
    "brightway25>=1.1.1",
    "scikit-umfpack>=0.4.2",
]
# For flowprog.io.system_definitions: parsing system definitions without a Sphinx
# build. The `loader` extra is what pulls in myst-parser and markdown-it-py.
definitions = [
    "sphinx-probs-rdf[loader]>=0.6.0",
]

[dependency-groups]
dev = [
    "pytest>=7.2.2",
    "hypothesis>=6.70.0",
    # 1.x is the last Sphinx-based jupyter-book version.
    "jupyter-book>=1.0.4,<2.0.0",
    "jupyterlab>=3.6.1",
    "ipysankeywidget>=0.5.0",
    "jupytext>=1.14.0",
    "arviz>=0.15",
    "matplotlib>=3.5",
    "flowprog[numpyro]",
    # Also provides the Sphinx extension the docs build uses
    "flowprog[definitions]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
