[project]
name = "flowprog"
version = "0.1.0"
description = "Define material flows models as programs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Rick Lupton", email = "mail@ricklupton.name"},
]
dependencies = [
    "sympy>=1.11.1",
    "pandas>=2.2.0",
    "rdflib>=6.0",
]

[project.optional-dependencies]
numpyro = [
    "jax>=0.4",
    "jaxlib>=0.4",
    "numpyro>=0.12",
]
benchmarks = [
    "doit>=0.37.0",
    "brightway25>=1.1.1",
    "scikit-umfpack>=0.4.2",
]
# For flowprog.io.system_definitions: parsing system definitions without a Sphinx
# build. The `loader` extra is what pulls in myst-parser and markdown-it-py.
definitions = [
    "sphinx-probs-rdf[loader]>=0.5.1",
]

# The loader is not in a released sphinx_probs_rdf yet -- until 0.5.1 is on PyPI, get
# it from git. Only affects how this project resolves it, not what it declares above.
[tool.uv.sources]
sphinx-probs-rdf = { git = "https://github.com/ricklupton/sphinx_probs_rdf", branch = "master" }

[dependency-groups]
dev = [
    "pytest>=7.2.2",
    "hypothesis>=6.70.0",
    # 1.x is the last Sphinx-based jupyter-book version.
    "jupyter-book>=1.0.4,<2.0.0",
    "jupyterlab>=3.6.1",
    "ipysankeywidget>=0.5.0",
    "jupytext>=1.14.0",
    "arviz>=0.15",
    "matplotlib>=3.5",
    "flowprog[numpyro]",
    # Also provides the Sphinx extension the docs build uses
    "flowprog[definitions]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
